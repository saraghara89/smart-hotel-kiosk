<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Self Check-Out</title><link rel="stylesheet" href="style/style.css"/></head>
<body><main class="app-shell"><section class="kiosk-card reservation-card"><div class="top-bar"><a href="index.html" class="back-btn">← Back</a></div><div class="reservation-header"><p class="eyebrow">Self Check-Out</p><h1>Return Your Room Card</h1><p class="subtitle">Enter your reservation details to finalize checkout and return the room card through the kiosk.</p></div><form id="checkoutForm" class="reservation-form"><div class="input-group"><label for="reservationCode">Reservation Code</label><input type="text" id="reservationCode" placeholder="Example: HT123" /></div><div class="input-group"><label for="email">Email Address</label><input type="email" id="email" placeholder="Example: sara@email.com" /></div><button type="submit" class="primary-btn">Complete Checkout</button><div id="message" class="site-message" aria-live="polite"></div></form></section></main><script src="js/api.js"></script><script src="js/checkout.js"></script></body>
</html>
